<title>Skill Dive: English</title>

<style>
:root{
  color-scheme: light dark;
  --bg:#e8f3f5; --card:#ffffff; --ink:#0f2f3d; --muted:#557683; --line:#c5dce2;
  --accent:#0a7d8c; --accent-ink:#ffffff; --sun:#f08a24; --soft:#d7ecf0; --good:#1f8f63;
  --shadow:0 2px 0 rgba(15,47,61,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1a21; --card:#12262f; --ink:#e5f1f4; --muted:#92adb7; --line:#244350;
    --accent:#3fbccb; --accent-ink:#052229; --sun:#f5a04a; --soft:#173540; --good:#4cc69a;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1a21; --card:#12262f; --ink:#e5f1f4; --muted:#92adb7; --line:#244350;
  --accent:#3fbccb; --accent-ink:#052229; --sun:#f5a04a; --soft:#173540; --good:#4cc69a;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-weight:500;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.1;margin:8px 0 6px;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 6px;font-weight:800}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.wave{display:block;width:100%;height:28px;margin:4px 0 14px;color:var(--accent)}
.intro{background:var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:18px}
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.strand{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.strand.done{border-color:var(--good)}
.strand .top{display:flex;align-items:center;gap:10px}
.strand .icon{font-size:1.7rem;width:2.4rem;text-align:center}
.status{font-size:.92rem;color:var(--muted)}
.status.ok{color:var(--good);font-weight:800}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:14px;border:2px solid transparent;min-height:50px;padding:10px 20px;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:active{transform:translateY(1px)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.link{background:none;border:none;color:var(--accent);min-height:44px;padding:8px 4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner{background:var(--card);border:2px solid var(--sun);border-radius:14px;padding:12px 16px;margin-bottom:16px}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.dot.now{background:var(--sun)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow)}
.passage{background:var(--soft);border-left:6px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:clamp(1.1rem,3.2vw,1.3rem);line-height:1.65}
.qtext{font-size:clamp(1.35rem,4vw,1.8rem);line-height:1.35;font-weight:700;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--bg);color:var(--ink);border:3px solid var(--line);font-size:clamp(1.1rem,3.4vw,1.35rem);font-weight:700;min-height:58px;padding:12px 16px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hint{font-size:.95rem;color:var(--muted);margin-top:14px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* writing */
.trait{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
.trait .nm{font-weight:800}
.scores{display:flex;gap:8px;margin-top:8px}
.scores button{min-width:56px;border-color:var(--line);background:var(--bg);color:var(--ink)}
.scores button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prompt{background:var(--soft);border-radius:16px;padding:16px 18px;font-size:1.2rem;font-weight:700;margin:12px 0}
/* results */
.bars{display:grid;gap:14px;margin:14px 0 22px}
.brow .lab{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 4px}
.seg i{height:16px;border-radius:6px;background:var(--line)}
.seg i.fill{background:var(--accent)}
.seg i.try{background:repeating-linear-gradient(45deg,var(--sun) 0 5px,transparent 5px 10px);border:2px solid var(--sun)}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:.78rem;color:var(--muted);text-align:center}
details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:12px 0}
summary{cursor:pointer;font-weight:800;min-height:32px}
textarea{width:100%;min-height:180px;font:inherit;font-size:.9rem;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.log{font-size:.92rem;margin:6px 0 0;padding-left:1.1em}
.log li{margin-bottom:6px}
.bad{color:#c0392b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bad{color:#ff8a7a}}
:root[data-theme="dark"] .bad{color:#ff8a7a}
</style>
</head>

["Which statement best describes the author’s approach?","It presents both benefits and concerns about rooftop gardens.","It argues strongly against rooftop gardens.","It explains how to build a rooftop garden.","It tells a story about one city.","Many cities have started adding rooftop gardens. Supporters point out that the plants cool buildings, reduce rainwater runoff, and give people green space. Critics worry about the high cost of installation and the added weight on older roofs."],

/* ---------- writing sample (grown-up scored) ---------- */
const WPROMPT="Write about a place you would love to explore and why. Try for 5 to 8 sentences.";
const TRAITS=[
{id:"ideas",name:"Ideas",desc:"Stays on topic and gives reasons or details."},
{id:"org",name:"Organization",desc:"Clear beginning, middle, and end; sentences in a sensible order."},
{id:"sent",name:"Sentences",desc:"Complete sentences, with some variety in how they start and sound."},
{id:"conv",name:"Spelling & punctuation",desc:"Capitals, end marks, and spelling of everyday words."}
];

/* ---------- state ---------- */
const KEY="skillDiveEnglish_v1";
const QCOUNT=10;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
let S=load()||{strands:{},writing:null};
function ST(id){if(!S.strands[id])S.strands[id]={level:3,streak:0,n:0,stats:{},log:[],seen:[],cur:null,done:false};return S.strands[id];}
const app=document.getElementById("app");
let resetArmed=false,sel=null,tmpScores={};

/* ---------- engine ---------- */
const keyOf=it=>it[0]+"|"+it[1]+"|"+(it[5]||"");
function gen(st,sid){
  const sd=STRANDS.find(s=>s.id===sid),bank=sd.bank[st.level];
  const fresh=bank.filter(it=>!st.seen.includes(keyOf(it)));
  const it=pick(fresh.length?fresh:bank);
  st.seen.push(keyOf(it));
  return{q:it[0],p:it[5]||"",opts:shuffle([it[1],it[2],it[3],it[4]]),c:it[1],level:st.level};
}
function placement(st){
  let best=0;
  for(let l=1;l<=6;l++){const s=st.stats[l];if(s&&s.c>=2&&s.c/s.a>=0.6)best=l;}
  const next=st.stats[best+1];
  return{best,tricky:(best<6&&next&&next.a>0)?best+1:null};
}

/* ---------- views ---------- */
function wave(){return `<svg class="wave" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14 Q 25 0 50 14 T 100 14 T 150 14 T 200 14 T 250 14 T 300 14 T 350 14 T 400 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`;}

function home(msg){
  const anyDone=STRANDS.some(s=>ST(s.id).done)||S.writing;
  const cards=STRANDS.map(s=>{
    const st=ST(s.id);
    let status,btn="";
    if(st.done){status=`<div class="status ok">Finished ✓</div>`;}
    else if(st.n>0){status=`<div class="status">In progress: ${st.n} of ${QCOUNT} answered</div>`;btn=`<button class="primary" data-go="${s.id}">Keep going</button>`;}
    else{status=`<div class="status">Not started</div>`;btn=`<button class="primary" data-go="${s.id}">Start</button>`;}
    return `<div class="strand ${st.done?"done":""}"><div class="top"><div class="icon" aria-hidden="true">${s.icon}</div><div><h2>${s.name}</h2><div class="muted">${s.blurb}</div></div></div>${status}${btn?`<div class="row">${btn}</div>`:""}</div>`;
  }).join("");
  const wcard=`<div class="strand ${S.writing?"done":""}"><div class="top"><div class="icon" aria-hidden="true">🖊️</div><div><h2>Writing sample</h2><div class="muted">Write on paper, then a grown-up scores it</div></div></div><div class="status ${S.writing?"ok":""}">${S.writing?"Scored ✓":"Not started"}</div><div class="row"><button class="${S.writing?"ghost":"primary"}" id="goWrite">${S.writing?"View or change":"Start"}</button></div></div>`;
  app.innerHTML=`
    <h1>Skill Dive: English</h1>${wave()}
    ${msg?`<div class="banner">${msg}</div>`:""}
    <div class="intro">
      <p><strong>Welcome back, explorer!</strong> Each dive has ${QCOUNT} questions. They start in the middle and get harder when you’re doing well, so some will feel tricky. That’s on purpose.</p>
      <p style="margin:0">Pick the answer you think is best, then tap Done. If you’re stuck, tap “Not sure yet.” Do one dive at a time.</p>
    </div>
    <div class="grid">${cards}${wcard}</div>
    ${anyDone?`<div class="row" style="margin-top:20px"><button class="ghost" id="seeRes">See results</button></div>`:""}`;
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>quiz(b.dataset.go)));
  document.getElementById("goWrite").addEventListener("click",writing);
  const r=document.getElementById("seeRes");if(r)r.addEventListener("click",results);
  window.scrollTo(0,0);
}

function speechText(q){return `${q.p?q.p+" ":""}${q.q} `+q.opts.map((o,i)=>`${"ABCD"[i]}. ${o}.`).join(" ");}

function quiz(id){
  const st=ST(id),sd=STRANDS.find(s=>s.id===id);
  if(st.done){home();return;}
  if(!st.cur){st.cur=gen(st,id);save();}
  const q=st.cur;sel=null;
  const dots=Array.from({length:QCOUNT},(_,i)=>`<span class="dot ${i<st.n?"on":i===st.n?"now":""}"></span>`).join("");
  const canSpeak=sd.speak&&"speechSynthesis" in window;
  app.innerHTML=`
    <div class="qtop"><button class="link" id="back">← Menu</button><strong>${sd.icon} ${sd.name}</strong></div>
    <div class="dots" role="img" aria-label="Question ${st.n+1} of ${QCOUNT}">${dots}</div>
    <div class="qcard">
      ${q.p?`<div class="passage">${q.p}</div>`:""}
      <div class="qtext">${q.q}</div>
      <div class="opts" role="group" aria-label="Answer choices">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${o}</button>`).join("")}</div>
      <div class="actions">
        <button class="primary" id="go">Done</button>
        <button class="ghost" id="idk">Not sure yet</button>
        ${canSpeak?`<button class="ghost" id="say" aria-label="Read the question aloud">🔊 Read it to me</button>`:""}
      </div>
      <div class="hint">Take your time. Tap an answer, then tap Done.</div>
    </div>`;
  document.getElementById("back").addEventListener("click",()=>home());
  document.getElementById("go").addEventListener("click",()=>submit(id,false));
  document.getElementById("idk").addEventListener("click",()=>submit(id,true));
  if(canSpeak)document.getElementById("say").addEventListener("click",()=>{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(speechText(q)));}catch(e){}});
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    sel=Number(b.dataset.i);
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  }));
  window.scrollTo(0,0);
}

function submit(id,idk){
  const st=ST(id),q=st.cur;if(!q)return;
  let given="not sure",ok=false;
  if(!idk){
    if(sel===null){const box=app.querySelector(".opts");box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");return;}
    given=q.opts[sel];ok=given===q.c;
  }
  const s=st.stats[q.level]||(st.stats[q.level]={a:0,c:0});
  s.a++;if(ok)s.c++;
  st.log.push({lvl:q.level,q:(q.p?q.p+" — ":"")+q.q,given,ok,ans:q.c});
  if(ok){st.streak++;if(st.streak>=2){st.level=Math.min(6,st.level+1);st.streak=0;}}
  else{st.level=Math.max(1,st.level-1);st.streak=0;}
  st.n++;st.cur=null;
  if(st.n>=QCOUNT){st.done=true;save();const sd=STRANDS.find(x=>x.id===id);home(`Dive finished: ${sd.name}. Nice work! Pick another dive whenever you’re ready.`);return;}
  save();quiz(id);
}

function writing(){
  tmpScores=Object.assign({},S.writing||{});
  const rows=TRAITS.map(t=>`<div class="trait"><div class="nm">${t.name}</div><div class="muted">${t.desc}</div><div class="scores" data-t="${t.id}">${[1,2,3,4].map(n=>`<button data-n="${n}" aria-pressed="${tmpScores[t.id]===n}" aria-label="${t.name}: ${n}">${n}</button>`).join("")}</div></div>`).join("");
  app.innerHTML=`
    <div class="qtop"><button class="link" id="back">← Menu</button></div>
    <h1>Writing sample</h1>${wave()}
    <p>Write on paper, with no help on spelling. About 10 to 15 minutes is plenty.</p>
    <div class="prompt">${WPROMPT}</div>
    <h2 style="margin-top:22px">For grown-ups: score what he wrote</h2>
    <p class="muted">Rate each part from 1 to 4 compared with a typical 3rd grader. 1 = needs a lot of support, 2 = still developing, 3 = solid for 3rd grade, 4 = strong, beyond 3rd grade.</p>
    ${rows}
    <div class="row" style="margin-top:14px"><button class="primary" id="saveW">Save scores</button><span id="wmsg" class="muted"></span></div>`;
  document.getElementById("back").addEventListener("click",()=>home());
  app.querySelectorAll(".scores").forEach(g=>g.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    tmpScores[g.dataset.t]=Number(b.dataset.n);
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  })));
  document.getElementById("saveW").addEventListener("click",()=>{
    const m=document.getElementById("wmsg");
    if(!TRAITS.every(t=>tmpScores[t.id])){m.textContent="Pick a score for all four parts first.";return;}
    S.writing=Object.assign({},tmpScores);save();home("Writing scores saved.");
  });
  window.scrollTo(0,0);
}

function writingLine(){
  if(!S.writing)return"";
  return TRAITS.map(t=>`${t.name} ${S.writing[t.id]}/4`).join(", ");
}

function summaryText(){
  const lines=["Skill Dive: English results","(Approximate levels from multiple-choice questions. A quick screener, not an official assessment.)",""];
  STRANDS.forEach(s=>{
    const st=ST(s.id);
    if(!st.done){lines.push(`${s.name}: not finished`);return;}
    const p=placement(st);
    const tot=Object.values(st.stats).reduce((x,y)=>({a:x.a+y.a,c:x.c+y.c}),{a:0,c:0});
    lines.push(`${s.name}: comfortable around ${p.best?"Grade "+p.best:"Grade 1 or below"}${p.tricky?`, getting tricky at Grade ${p.tricky}`:""} (${tot.c}/${tot.a} correct)`);
  });
  lines.push(S.writing?`Writing sample (grown-up scored, 1 to 4 vs. 3rd grade): ${writingLine()}`:"Writing sample: not scored");
  lines.push("","Missed or skipped questions:");
  STRANDS.forEach(s=>{
    ST(s.id).log.filter(l=>!l.ok).forEach(l=>lines.push(`- [${s.name}, level ${l.lvl}] ${l.q} | answered: ${l.given} | correct: ${l.ans}`));
  });
  return lines.join("\n");
}

function results(){
  resetArmed=false;
  const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const rows=STRANDS.map(s=>{
    const st=ST(s.id);
    if(!st.done){
      return `<div class="brow"><div class="lab"><span>${s.icon} ${s.name}</span><span class="muted">${st.n>0?"Not finished":"Not started"}</span></div></div>`;
    }
    const p=placement(st);
    const segs=[1,2,3,4,5,6].map(l=>`<i class="${l<=p.best?"fill":l===p.tricky?"try":""}"></i>`).join("");
    const note=p.best===0?"Still building the basics here":`Comfortable around Grade ${p.best}`+(p.tricky?`; Grade ${p.tricky} is where it gets tricky`:p.best===6?"; may be ready for even harder material":"");
    return `<div class="brow"><div class="lab"><span>${s.icon} ${s.name}</span></div><div class="seg">${segs}</div><div class="scale"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div><div class="muted">${note}</div></div>`;
  }).join("");
  const wrow=`<div class="brow"><div class="lab"><span>🖊️ Writing sample</span><span class="muted">${S.writing?"Scored by a grown-up":"Not scored"}</span></div>${S.writing?`<div class="muted">${writingLine()}</div>`:""}</div>`;
  const logs=STRANDS.filter(s=>ST(s.id).log.length).map(s=>{
    const st=ST(s.id);
    return `<details><summary>${s.icon} ${s.name}: every question</summary><ol class="log">${st.log.map(l=>`<li class="${l.ok?"":"bad"}">[L${l.lvl}] ${esc(l.q)}<br>Answered: ${esc(l.given)}${l.ok?" ✓":` ✗ (correct: ${esc(l.ans)})`}</li>`).join("")}</ol></details>`;
  }).join("");
  app.innerHTML=`
    <div class="qtop"><button class="link" id="back">← Menu</button></div>
    <h1>Results</h1>${wave()}
    <p class="muted">Filled blocks show where he’s solid. A striped block is the level where it started to get hard. Levels 1–6 loosely follow Grades 1–6.</p>
    <div class="bars">${rows}${wrow}</div>
    <details><summary>For grown-ups: copy a summary</summary>
      <p class="muted">Levels are rough estimates from ${QCOUNT} multiple-choice questions per area, so some lucky guesses are possible. Skim the questions for errors and for skipped or rushed answers before trusting a number.</p>
      <textarea id="sum" readonly>${esc(summaryText())}</textarea>
      <div class="row" style="margin-top:10px"><button class="primary" id="copy">Copy summary</button><span id="copied" class="muted"></span></div>
    </details>
    ${logs}
    <div class="row" style="margin-top:22px"><button class="ghost" id="reset">Start over (clears all results)</button></div>`;
  document.getElementById("back").addEventListener("click",()=>home());
  document.getElementById("copy").addEventListener("click",async()=>{
    const t=document.getElementById("sum"),c=document.getElementById("copied");
    try{await navigator.clipboard.writeText(t.value);c.textContent="Copied.";}
    catch(e){t.focus();t.select();c.textContent="Text selected. Tap Copy in the menu.";}
  });
  const rs=document.getElementById("reset");
  rs.addEventListener("click",()=>{
    if(!resetArmed){resetArmed=true;rs.textContent="Tap again to erase everything";return;}
    S={strands:{},writing:null};save();home("Everything was cleared. You can start fresh.");
  });
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
